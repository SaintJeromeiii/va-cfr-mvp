name: CI

on:
  pull_request:
    branches: [ master ]
  push:
    branches: [ master ]
  workflow_dispatch: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Install, Audit, and E2E
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run npm audit (fail on moderate+)
        run: npm audit --audit-level=moderate

      - name: Install Playwright browsers
        run: npm run test:e2e:install

      - name: Run Playwright tests
        env:
          CI: true
        run: |
          set -o pipefail
          npx playwright test --reporter=html=playwright-report --reporter=junit=playwright-junit.xml || true

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report
            playwright-junit.xml
          retention-days: 30

      - name: Publish JUnit annotations
        if: always()
        uses: dorny/test-reporter@v1
        with:
          name: Playwright
          path: playwright-junit.xml
          reporter: junit
          token: ${{ secrets.GITHUB_TOKEN }}
          fail-on-error: false
