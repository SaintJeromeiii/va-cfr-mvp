name: Playwright Smoke Tests

on:
  pull_request:
    branches: [ master ]
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

jobs:
  smoke:
    name: Playwright Smoke Tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        shard: ["1/8", "2/8", "3/8", "4/8", "5/8", "6/8", "7/8", "8/8"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Cache node modules
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npm run test:e2e:install

      - name: Run Playwright tests (shard ${{ matrix.shard }})
        env:
          CI: true
        run: |
          set -o pipefail
          # run Playwright with shard and per-shard reporters so artifacts don't collide
          shard="${{ matrix.shard }}"
          safe_shard="${shard//\//-}"
          npx playwright test --shard="$shard" \
            --reporter=html=playwright-report-${safe_shard} \
            --reporter=junit=playwright-junit-${safe_shard}.xml \
            2>&1 | tee playwright-run-${safe_shard}.log

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report*
            playwright-report*/**
            playwright-run-*.log
      - name: Post JUnit summary to PR
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v6
        with:
          script: |
            const fs = require('fs');
            // find any per-shard junit file
            const files = require('glob').sync('**/playwright-junit-*.xml', { nodir: true });
            let body = 'Playwright JUnit summary (sharded):\n\n';
            if (files && files.length) {
              for (const f of files.slice(0,8)) {
                body += `**${f}**\n`;
                const content = fs.readFileSync(f, 'utf8').split(/\r?\n/).slice(0,50).join('\n');
                body += '```\n' + content + '\n```\n\n';
              }
            } else {
              body += 'No junit files found.';
            }
            const pr = github.context.payload.pull_request && github.context.payload.pull_request.number;
            if (pr) {
              await github.rest.issues.createComment({ owner: context.repo.owner, repo: context.repo.repo, issue_number: pr, body });
            } else {
              core.info('No pull request found to comment on.');
            }
        - name: Post concise JUnit summary to PR (sharded)
          if: always() && github.event_name == 'pull_request'
          uses: actions/github-script@v6
          with:
            script: |
              const fs = require('fs');
              const glob = require('glob');
              const files = glob.sync('**/playwright-junit-*.xml', { nodir: true });
              let body = 'Playwright JUnit summary (sharded):\n\n';
              if (files && files.length) {
                for (const f of files.slice(0,8)) {
                  body += `**${f}**\n`;
                  const xml = fs.readFileSync(f, 'utf8');
                  const m = xml.match(/<testsuites[^>]*tests=["'](\d+)["'][^>]*failures=["'](\d+)["'][^>]*skipped=["'](\d+)["'][^>]*errors=["'](\d+)["']/) || xml.match(/<testsuite[^>]*tests=["'](\d+)["'][^>]*failures=["'](\d+)["'][^>]*skipped=["'](\d+)["'][^>]*errors=["'](\d+)["']/) || [];
                  const tests = m[1] || 'unknown';
                  const failures = m[2] || '0';
                  const skipped = m[3] || '0';
                  const errors = m[4] || '0';
                  body += `Tests: ${tests}, Failures: ${failures}, Skipped: ${skipped}, Errors: ${errors}\n`;
                  const snippet = xml.split(/\r?\n/).slice(0,30).join('\n');
                  body += '```xml\n' + snippet + '\n```\n\n';
                }
              } else {
                body += 'No junit files found.';
              }
              const pr = github.context.payload.pull_request && github.context.payload.pull_request.number;
              if (pr) {
                await github.rest.issues.createComment({ owner: context.repo.owner, repo: context.repo.repo, issue_number: pr, body });
              } else {
                core.info('No pull request found to comment on.');
              }
          retention-days: 30

      - name: Upload traces and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces-screenshots
          path: |
            playwright-report-*/traces
            playwright-report-*/screenshots
            test-results/screenshots
          retention-days: 30

      - name: Upload test-results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results
          retention-days: 30

      # Publishing JUnit annotations skipped temporarily because the
      # configured test reporter action rejects the `reporter: junit` value
      # on the current runner. Re-add a compatible reporter in a follow-up
      # change if PR annotations are required.

      - name: Post artifacts list to PR
        if: ${{ github.event_name == 'pull_request' }}
        uses: actions/github-script@v6
        with:
          script: |
            const runId = parseInt(process.env.GITHUB_RUN_ID, 10);
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const runUrl = `https://github.com/${owner}/${repo}/actions/runs/${runId}`;
            // list artifacts for this run
            const artifacts = await github.rest.actions.listWorkflowRunArtifacts({ owner, repo, run_id: runId });
            let body = `Playwright run finished.\n\nWorkflow run: ${runUrl}\n\nArtifacts for this run:\n\n`;
            if (artifacts.data && artifacts.data.artifacts && artifacts.data.artifacts.length) {
              for (const a of artifacts.data.artifacts) {
                // archive_download_url requires auth but is accessible to repo members
                body += `- **${a.name}** — [download](${a.archive_download_url})\n`;
              }
            } else {
              body += 'No artifacts found.\n';
            }
            body += '\nJUnit annotations (if any) are posted on this PR.';
            const pr = github.context.payload.pull_request && github.context.payload.pull_request.number;
            if (pr) {
              await github.rest.issues.createComment({ owner, repo, issue_number: pr, body });
            } else {
              core.info('No pull request found to comment on.');
            }

  regression:
    name: Nightly Regression
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'schedule' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npm run test:e2e:install

      - name: Run full Playwright regression
        env:
          CI: true
        run: |
          # run full suite nightly; use 2 workers to parallelize across CPUs
          npx playwright test --workers=2 --reporter=html=playwright-regression-report --reporter=junit=playwright-regression-junit.xml || true
      - name: Upload regression report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-regression-report
          path: |
            playwright-regression-report
            playwright-regression-report/**
          retention-days: 30

      - name: Upload regression junit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-regression-junit
          path: playwright-regression-junit.xml
          retention-days: 30

      - name: Publish regression JUnit annotations
        if: always()
        uses: dorny/test-reporter@v1
        with:
          name: Playwright Regression
          path: "playwright-regression-junit.xml"
          reporter: junit
          token: ${{ secrets.GITHUB_TOKEN }}
          fail-on-error: false
