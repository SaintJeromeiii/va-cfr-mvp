name: Playwright Smoke Tests

on:
  pull_request:
    branches: [ master ]
  schedule:
    - cron: '0 3 * * *'

jobs:
  smoke:
    name: Playwright Smoke Tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        shard: ["1/2", "2/2"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Cache node modules
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npm run test:e2e:install

      - name: Run Playwright tests (shard ${{ matrix.shard }})
        env:
          CI: true
        run: |
          # run Playwright with shard and per-shard reporters so artifacts don't collide
          npx playwright test --shard=${{ matrix.shard }} --reporter=html=playwright-report-${{ matrix.shard }} --reporter=junit=playwright-junit-${{ matrix.shard }}

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report
            playwright-report/**
          retention-days: 30

      - name: Upload traces and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces-screenshots
          path: |
            playwright-report/traces
            playwright-report/screenshots
            test-results/screenshots
          retention-days: 30

      - name: Upload test-results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results
          retention-days: 30

      - name: Publish JUnit test annotations
        if: always()
        uses: dorny/test-reporter@v1
        with:
          name: Playwright
          path: "**/playwright-junit-*.xml"
          reporter: junit
          token: ${{ secrets.GITHUB_TOKEN }}
          fail-on-error: false
