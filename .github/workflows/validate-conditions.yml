name: Validate conditions.json

on:
  pull_request:
    paths:
      - 'data/conditions.json'
      - 'scripts/**'
  push:
    branches:
      - master
      - 'apply-*'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install dependencies
        run: npm ci

      - name: Run conditions validation
        run: node scripts/validate_conditions.js
