name: Smoke Tests

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  smoke-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Build and run container
        run: |
          docker build -t va-cfr-mvp:ci .
          docker run -d --name va-cfr-mvp -p 3000:3000 va-cfr-mvp:ci || true
          for i in {1..30}; do
            if curl -sSf http://localhost:3000 >/dev/null; then
              echo "server available"
              break
            fi
            sleep 1
          done

      - name: Run legacy smoke scripts and Playwright
        run: |
          npm run smoke:all > smoke-tests.log 2>&1 || true
          echo 'run playwright tests'
          npx playwright test --output=playwright-results || true
          echo 'collecting container logs'
          docker logs va-cfr-mvp > server.log 2>&1 || true
        env:
          NODE_ENV: test

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-logs
          path: |
            server.log
            smoke-tests.log

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report
            playwright-results

      - name: Cleanup container
        if: always()
        run: |
          docker stop va-cfr-mvp || true
          docker rm va-cfr-mvp || true
