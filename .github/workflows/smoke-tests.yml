name: Smoke Tests

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch: {}
  schedule:
    # daily at 02:00 UTC
    - cron: '0 2 * * *'

jobs:
  smoke-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Build and run container
        run: |
          docker build -t va-cfr-mvp:ci .
          docker run -d --name va-cfr-mvp -p 3000:3000 va-cfr-mvp:ci || true
          # wait up to 60s for server to become available
          for i in {1..60}; do
            if curl -sSf http://localhost:3000 >/dev/null; then
              echo "server available"
              break
            fi
            sleep 1
          done

      - name: Run legacy smoke scripts and Playwright
        run: |
          # ensure log file exists even if smoke script fails
          touch smoke-tests.log
          timeout 2m npm run smoke:all > smoke-tests.log 2>&1 || true
          echo 'run playwright tests'
          npx playwright test --output=playwright-results || true
          # allow Playwright a moment to flush reporters
          sleep 1
          echo "Attempting to copy nested playwright junit to repo root..."
          if [ -f playwright-report/playwright-junit.xml ]; then
            echo "copying playwright-report/playwright-junit.xml -> playwright-junit.xml"
            cp playwright-report/playwright-junit.xml playwright-junit.xml || true
          fi
          if [ -f playwright-results/playwright-junit.xml ]; then
            echo "copying playwright-results/playwright-junit.xml -> playwright-junit.xml"
            cp playwright-results/playwright-junit.xml playwright-junit.xml || true
          fi
          # fallback: find any junit produced in workspace and copy to repo root
          find . -type f -name 'playwright-junit.xml' -not -path './playwright-junit.xml' -exec cp {} playwright-junit.xml \; || true
          echo "After copy, workspace junit listing:"
          ls -la playwright-junit.xml || true
          echo 'collecting container logs'
          docker logs va-cfr-mvp > server.log 2>&1 || true
        env:
          NODE_ENV: test

      # Note: Playwright already runs on the host above; the isolated Docker run
      # was removed to avoid duplicate test runs and wasted CI time.

      - name: Publish Playwright JUnit annotations
        if: always()
        uses: dorny/test-reporter@v1
        with:
          name: Playwright
          path: |
            playwright-report/playwright-junit.xml
            **/playwright-junit.xml
          reporter: junit
          fail-on-empty: false
          fail-on-error: false

      - name: Dump Playwright JUnit (for debug)
        if: always()
        run: |
          echo "Workspace files:"
          ls -la
          echo "Looking for junit at repo root..."
          if [ -f playwright-junit.xml ]; then
            echo "--- playwright-junit.xml (first 200 lines) ---"
            sed -n '1,200p' playwright-junit.xml || true
            echo "--- end of file ---"
          else
            echo "no playwright-junit.xml at repo root"
          fi

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-logs
          path: |
            server.log
            smoke-tests.log

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report
            playwright-results
            playwright-junit.xml

      - name: Cleanup container
        if: always()
        run: |
          docker stop va-cfr-mvp || true
          docker rm va-cfr-mvp || true
