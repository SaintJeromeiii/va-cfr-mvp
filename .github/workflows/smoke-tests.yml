name: Smoke Tests

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm ci

      - name: Start server in background and wait
        run: |
          node server.js &
          for i in $(seq 1 30); do
            if curl -sS http://localhost:3000/ >/dev/null 2>&1; then
              echo "server up"; break
            fi
            echo "waiting for server... ($i)"; sleep 1
          done

      - name: Run smoke tests
        run: npm run smoke:all
