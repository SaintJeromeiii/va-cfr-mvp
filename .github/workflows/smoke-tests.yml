name: Smoke tests

on:
  pull_request:
  push:
    branches: [ master ]

jobs:
  smoke-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm ci

      - name: Start server
        run: |
          docker build -t va-cfr-mvp:ci .
          docker run -d --name va-cfr-mvp -p 3000:3000 va-cfr-mvp:ci || true
          for i in {1..30}; do
            if curl -sSf http://localhost:3000 >/dev/null; then
              echo "server available"
              break
            fi
            sleep 1
          done

      - name: Run smoke tests
        run: |
          npm run smoke:all > smoke-tests.log 2>&1 || true
          echo 'collecting container logs'
          docker logs va-cfr-mvp > server.log 2>&1 || true
        env:
          NODE_ENV: test

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-logs
          path: |
            server.log
            smoke-tests.log
      - name: Cleanup container
        if: always()
        run: |
          docker stop va-cfr-mvp || true
          docker rm va-cfr-mvp || true
name: Smoke Tests

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm ci

      - name: Start server in background and wait
        run: |
          node server.js &
          for i in $(seq 1 30); do
            if curl -sS http://localhost:3000/ >/dev/null 2>&1; then
              echo "server up"; break
            fi
            echo "waiting for server... ($i)"; sleep 1
          done

      - name: Run smoke tests
        run: npm run smoke:all
