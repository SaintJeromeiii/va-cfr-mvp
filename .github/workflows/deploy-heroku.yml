name: Deploy to Heroku

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm ci

      - name: Run Playwright tests (optional)
        run: |
          npm run test:e2e:install || true
          npm run test:e2e || true

      - name: Build (optional)
        run: echo "Skipping build step; app starts with node server.js"

      - name: Deploy to Heroku via git push
        env:
          HEROKU_API_KEY: ${{ secrets.HEROKU_API_KEY }}
          HEROKU_APP_NAME: ${{ secrets.HEROKU_APP_NAME }}
          HEROKU_TARGET_BRANCH: ${{ secrets.HEROKU_TARGET_BRANCH }}
        run: |
          set -e
          git config --global user.email "actions@github.com"
          git config --global user.name "github-actions"
          git remote remove heroku || true
          git remote add heroku https://heroku:${HEROKU_API_KEY}@git.heroku.com/${HEROKU_APP_NAME}.git
          TARGET_BRANCH=${HEROKU_TARGET_BRANCH:-master}
          echo "Pushing to Heroku remote branch: ${TARGET_BRANCH}"
          git push --force heroku HEAD:${TARGET_BRANCH}

      - name: Verify deploy (healthcheck)
        run: |
          set -e
          APP_URL="https://va-cfr-mvp-prod-306dc4f53d87.herokuapp.com/"
          echo "Checking app URL: ${APP_URL}"
          for i in 1 2 3 4 5; do
            status=$(curl -s -o /dev/null -w "%{http_code}" "${APP_URL}" || echo "000")
            echo "Healthcheck attempt $i: $status"
            if [ "${status}" -ge 200 ] && [ "${status}" -lt 400 ]; then
              echo "App responded ${status} — healthy"
              exit 0
            fi
            sleep 5
          done
          echo "Healthcheck failed after retries"
          exit 1