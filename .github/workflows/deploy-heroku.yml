name: Deploy to Heroku

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Run Playwright tests (optional)
        run: |
          npm run test:e2e:install || true
          npm run test:e2e || true

      - name: Build (optional)
        run: echo "Skipping build step; app starts with node server.js"

      - name: Deploy to Heroku via git push
        env:
          HEROKU_API_KEY: ${{ secrets.HEROKU_API_KEY }}
          HEROKU_APP_NAME: ${{ secrets.HEROKU_APP_NAME }}
        run: |
          set -e
          git config --global user.email "actions@github.com"
          git config --global user.name "github-actions"
          # Add Heroku remote using API key for authentication and push
          git remote add heroku https://heroku:${HEROKU_API_KEY}@git.heroku.com/${HEROKU_APP_NAME}.git || true
          git push --force heroku HEAD:master
