name: Audit and Lockfile Check

on:
  pull_request:
  push:
    branches: [ master ]

jobs:
  audit-and-lockfile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run npm audit
        run: |
          npm audit --audit-level=moderate

      - name: Ensure lockfile unchanged
        run: |
          git diff --exit-code package-lock.json || (echo "package-lock.json changed; run npm ci and commit the lockfile" && exit 1)
