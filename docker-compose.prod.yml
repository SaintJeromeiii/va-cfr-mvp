version: '3.8'

services:
  web:
    build: .
    image: va-cfr-mvp:latest
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: 3000
    ports:
      - "3000:3000"
    volumes:
      - ./data:/usr/src/app/data
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
